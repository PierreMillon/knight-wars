<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1b1712; font-family: -apple-system, system-ui, sans-serif;
    touch-action: manipulation; user-select: none;
  }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; background: #2b3d52; }
  #status, #log { display: none; } /* kept for internal state only, no longer shown */
  #settingsBtn {
    position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 14px;
    pointer-events: auto; background: rgba(20,16,12,.55);
    border: 1px solid rgba(242,237,226,.35); border-radius: 8px;
    width: 34px; height: 34px; padding: 3px;
  }
  #settingsBtn img { width: 100%; height: 100%; object-fit: contain; }
  #endturn {
    position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); right: 14px;
    pointer-events: auto; white-space: nowrap;
    /* background color is set inline in JS to match the player's chosen royaume */
    border: 1px solid rgba(20,16,12,.4); border-radius: 8px;
    padding: 10px 18px; font-size: 15px; font-weight: 700;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #endturn.aiTurn { opacity: .72; font-weight: 600; font-style: italic; }
  /* ambient decoration on wide (desktop) viewports only — never shown on phone */
  .sideArt {
    position: fixed; bottom: 0; height: 55vh; max-height: 520px; width: auto; max-width: 16vw;
    object-fit: contain; pointer-events: none; display: none; image-rendering: pixelated;
    opacity: .9; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5));
  }
  .sideArtLeft { left: 2vw; }
  .sideArtRight { right: 2vw; }
  @media (min-width: 900px) {
    .sideArt { display: block; }
  }
  #gueuxBadge {
    position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 54px;
    display: none; align-items: center; pointer-events: none;
    background: rgba(20,16,12,.55); border: 1px solid rgba(242,237,226,.3); border-radius: 20px;
    color: #f2ede2; font-size: 12px; padding: 8px 12px; font-weight: 700;
  }
  #endturn:disabled { background: #5a5044 !important; color: #f2ede2 !important; opacity: .6; }
  #topBar {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 6px;
    box-sizing: border-box; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: #f2ede2; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #bottomBar {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 60px calc(10px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; /* only rerollBtn itself is clickable — the corner buttons sit under this full-width bar */
  }
  #groupsLegend { font-size: 9.5px; opacity: .55; letter-spacing: .02em; }
  #groups {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 4px 10px; max-width: 100%; justify-items: center;
  }
  .chip { display: flex; align-items: center; gap: 3px; font-size: 9.5px; white-space: nowrap; flex: none; }
  .chip .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .chip .n { font-weight: 700; }
  #settingsPanel {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;

// 1/3/9. Raised so the top tier takes longer to reach.
const FORCE_CAP = 12;
const ARCHER_THRESHOLD = 4;

// temporary: character sprites are disabled (plain numbers only) per request
// — kept fully in place so they can be switched back on later.
const SHOW_UNIT_SPRITES = false;

// palette per https://coolors.co/0a1128-001f54-931f1d-c6a15b-f7f0f5
// which of the 4 real royaumes (0-3) is actually human-controlled is decided
// at runtime by `humanRoyId` (see GAME STATE below) — chosen via the "Votre
// camp" picker in settings, not fixed per-seat here.
const ROYAUMES = [
  { id: 0, name: "Châteauvieux", color: "#f7f0f5", accent: "#001f54", chief: "#931f1d" },
  { id: 1, name: "Villiers",     color: "#931f1d", accent: "#c6a15b", chief: "#0a1128" },
  { id: 2, name: "Montherlant",  color: "#c6a15b", accent: "#f7f0f5", chief: "#931f1d" },
  { id: 3, name: "Beaumanoir",   color: "#001f54", accent: "#f7f0f5", chief: "#c6a15b" },
  { id: 4, name: "Neutre",       color: "#6b7280", accent: "#4a5568", chief: "#4a5568", neutral: true }, // lightened from #0a1128 — too close to the canvas/background at full darkness
];

// Difficulty: still a continuous 0-1 value under the hood (driving AI traits
// and the share of neutral territories), but exposed to the player as 4
// named levels rather than a raw slider.
let DIFFICULTY = 0.4;
let NEUTRAL_FRACTION = 0.2;
let AI_AGGRESSION_THRESHOLD = 0;
let AI_MISTAKE_RATE = 0.15;
function lerp(a, b, t) { return a + (b - a) * t; }
function applyDifficulty(d) {
  DIFFICULTY = Math.max(0, Math.min(1, d));
  NEUTRAL_FRACTION = lerp(0.36, 0.06, DIFFICULTY);

  // mass-simulation during calibration showed that raising this above ~1
  // lets AI-vs-AI borders permanently gridlock once forces saturate at the
  // cap (neither side can ever again meet the threshold). 0.5 is already
  // near that ceiling; MISTAKE_RATE carries the rest of the "easy" end.
  // (0.85 was tried for the easy-end mistake rate and, combined with the
  // wider neutral buffer, produced games that technically never lost but
  // also dragged on for hundreds of rounds without a winner — dialed back.)
  AI_AGGRESSION_THRESHOLD = lerp(0.5, -2.2, DIFFICULTY);
  AI_MISTAKE_RATE = lerp(0.55, 0, DIFFICULTY);
}

// Safety valve: at the easy end, 3 very passive AIs can coexist without
// fighting each other OR the player, so a game can drag on for hundreds of
// rounds without ever reaching the "one non-neutral owner left" win
// condition — confirmed via mass simulation. Past ESCALATION_START_ROUND,
// AI aggression/mistakes ratchet toward their hardest values over the next
// 40 rounds regardless of difficulty, so every game is guaranteed to
// converge instead of stalling indefinitely.
const ESCALATION_START_ROUND = 40, ESCALATION_SPAN = 40;
function escalated(baseValue, hardValue) {
  if (roundNumber <= ESCALATION_START_ROUND) return baseValue;
  const t = Math.min(1, (roundNumber - ESCALATION_START_ROUND) / ESCALATION_SPAN);
  const interp = lerp(baseValue, hardValue, t);
  // For both fields, lower = harder (more aggressive / fewer mistakes). This
  // ratchet exists to keep an EASY game from stalling forever — it's a floor
  // that only ever helps a passive AI catch up, never a ceiling that softens
  // an already-harder-than-that base setting (Seigneur's base can be tougher
  // than these hard values, and must stay that tough for the whole match).
  return baseValue <= hardValue ? Math.min(baseValue, interp) : interp;
}
const DIFFICULTY_LEVELS = [
  { name: "Page",      value: 0 },
  { name: "Écuyer",    value: 0.35 },
  { name: "Chevalier", value: 0.7 },
  { name: "Seigneur",  value: 1 },
];
let difficultyLevel = 1; // Écuyer — matches the previous flat default
try {
  const saved = localStorage.getItem("kw_difficultyLevel");
  if (saved !== null) difficultyLevel = Math.max(0, Math.min(DIFFICULTY_LEVELS.length - 1, Number(saved)));
} catch (e) { /* ignore */ }
applyDifficulty(DIFFICULTY_LEVELS[difficultyLevel].value);

const SQRT3 = Math.sqrt(3);

/* ---------- CANVAS SETUP ---------- */
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let centerX = 0, centerY = 0, viewScale = 1;

/* ---------- CHARACTER SPRITES ---------- */
function loadSprite(src) {
  const img = new Image();
  img.onload = () => render();
  img.src = src;
  return img;
}
const GUEUX_IMG = loadSprite(GUEUX_IMG_SRC);
const ARCHER_IMG = loadSprite(ARCHER_IMG_SRC);
const CHEVALIER_IMG = loadSprite(CHEVALIER_IMG_SRC);

function resize() {
  const dpr = window.devicePixelRatio || 1;
  // visualViewport reflects what's actually visible on iOS Safari — its
  // collapsing/expanding address bar can leave window.innerHeight reporting
  // a taller area than what's really on screen, which is exactly what let
  // the map overflow past the real bottom/right edge there.
  const vv = window.visualViewport;
  const w = vv ? vv.width : window.innerWidth;
  const h = vv ? vv.height : window.innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // reserve room for the top stats bar and the bottom buttons (both heights
  // measured live — the top bar's content can vary a bit) so the map never
  // renders underneath/crowding either one
  const topInset = document.getElementById("topBar").offsetHeight + 6;
  const bottomInset = Math.max(
    document.getElementById("settingsBtn").offsetHeight,
    document.getElementById("endturn").offsetHeight,
    document.getElementById("bottomBar").offsetHeight
  ) + 20;
  const availH = h - topInset - bottomInset;
  centerX = w / 2; centerY = topInset + availH / 2;
  // Fit to the map's *actual* generated extents (not a nominal guess) so it
  // never overflows past the screen edge regardless of the random jitter —
  // whichever axis (width or the taller island's height) is tightest wins.
  const pad = HEX_SIZE * 2;
  const extentX = mapExtentX || MAP_PIXEL_RADIUS, extentY = mapExtentY || MAP_PIXEL_RADIUS;
  viewScale = Math.min(w / (2 * extentX + pad), availH / (2 * extentY + pad));
  // (no extra phone-only boost here anymore — it was overflowing the real
  // viewport on Safari/PWA. This tight fit to the actual generated bounds is
  // the whole size increase now; see HEX_SIZE/Y_STRETCH above for the rest.)
  render();
}
window.addEventListener("resize", resize);
// iOS Safari's address bar collapses/expands after load, changing the
// visible viewport without a plain "resize" event — this keeps the map
// correctly fitted to what's actually visible instead of the taller
// pre-scroll measurement.
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

/* ---------- HEX MATH ---------- */
function axialToPixel(q, r) {
  return {
    x: HEX_SIZE * SQRT3 * (q + r / 2),
    y: HEX_SIZE * 1.5 * r,
  };
}
function pixelToAxial(x, y) {
  const r = y / (HEX_SIZE * 1.5);
  const q = x / (HEX_SIZE * SQRT3) - r / 2;
  return cubeRound(q, r);
}
function cubeRound(q, r) {
  let x = q, z = r, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = -ry - rz;
  else if (dy > dz) ry = -rx - rz;
  else rz = -rx - ry;
  return { q: rx, r: rz };
}
const NEI = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function neighborsOf(q, r) { return NEI.map(([dq,dr]) => `${q+dq},${r+dr}`); }

function hexCorners(cx, cy, size) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    pts.push([cx + size * Math.cos(a), cy + size * Math.sin(a)]);
  }
  return pts;
}

/* ---------- SEEDED RNG ---------- */
// mulberry32 — small, fast, deterministic PRNG. Every source of randomness in
// the game (map generation, dice, AI mistakes) goes through this instead of
// Math.random(), so an entire match can be reproduced byte-for-byte from one
// 32-bit seed. That's what makes a cheap "replay code" possible later: share
// the seed + the human player's own move list instead of every dice roll.
let rngState = 0;
function seedRNG(seed) {
  rngState = seed >>> 0;
}
function rngFloat() {
  rngState |= 0; rngState = (rngState + 0x6D2B79F5) | 0;
  let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
// only used to pick an unpredictable *starting* seed for a fresh game —
// never called during actual map/combat generation, so it doesn't break
// reproducibility of the seed it hands out
function randomSeed() {
  if (window.crypto && crypto.getRandomValues) {
    return crypto.getRandomValues(new Uint32Array(1))[0];
  }
  return (Date.now() ^ (performance.now() * 1000)) >>> 0;
}

/* ---------- MAP GENERATION ---------- */
let hexes = {};          // key "q,r" -> {q,r,x,y,territoryId}
let mapExtentX = 0, mapExtentY = 0; // actual generated island bounds, set by generateHexGrid()
let territories = [];    // {id, hexKeys[], owner, force, cx, cy, neighbors:Set}
let players = [];        // per-royaume runtime state
let territoryBorderSegments = []; // [[x1,y1],[x2,y2]] edges between two different territories, precomputed once
let currentSeed = 0;     // the seed this match was generated from — the whole match is reproducible from this + the human's move list

function rand(n) { return Math.floor(rngFloat() * n); }
function pick(arr) { return arr[rand(arr.length)]; }

function generateHexGrid() {
  hexes = {};
  const range = Math.ceil(MAP_PIXEL_RADIUS / (HEX_SIZE * 1.5)) + 2;

  // random island silhouette: sum of a few sine harmonics with random phase/amplitude,
  // recomputed each new game so the outer contour differs from one game to the next
  const harmonics = [2, 3, 4, 5].map(freq => ({
    freq,
    phase: rngFloat() * Math.PI * 2,
    amp: 0.03 + rngFloat() * 0.05,
  }));
  function radialJitter(theta) {
    let j = 1;
    for (const h of harmonics) j += h.amp * Math.sin(h.freq * theta + h.phase);
    return j;
  }

  // Stretched taller than wide (portrait-phone aspect) so the island fills
  // more of the screen vertically instead of leaving a circle's worth of
  // empty margin above and below on a tall viewport.
  const Y_STRETCH = 1.3;
  let maxX = 0, maxY = 0;
  for (let q = -range; q <= range; q++) {
    for (let r = -range; r <= range; r++) {
      const { x, y } = axialToPixel(q, r);
      const yy = y / Y_STRETCH; // normalize into circular space for the radial check
      const dist = Math.sqrt(x * x + yy * yy);
      const theta = Math.atan2(yy, x);
      if (dist <= MAP_PIXEL_RADIUS * radialJitter(theta)) {
        hexes[`${q},${r}`] = { q, r, x, y, territoryId: -1 };
        if (Math.abs(x) > maxX) maxX = Math.abs(x);
        if (Math.abs(y) > maxY) maxY = Math.abs(y);
      }
    }
  }
  // actual generated extents — used instead of the nominal MAP_PIXEL_RADIUS
  // for scaling, since the random jitter can push the real silhouette well
  // past that nominal radius in some directions (that mismatch is what
  // caused the map to overflow past the screen edge on some devices/games)
  mapExtentX = maxX;
  mapExtentY = maxY;

  carveVoids();
}

// A few interior lakes/impassable pockets — small chunks of the island that
// belong to no territory at all (just empty background, unclickable, no
// village). Purely a bit of visual/tactical texture so the island isn't one
// uniform blob; carving is capped so there's always plenty of room left for
// every territory to seed and grow normally.
const VOID_COUNT = 2;
const VOID_MIN_SIZE = 3, VOID_MAX_SIZE = 7;
function carveVoids() {
  const minRemaining = TERRITORY_COUNT * 3;
  for (let v = 0; v < VOID_COUNT; v++) {
    const candidates = Object.keys(hexes);
    if (candidates.length <= minRemaining) break;
    const seedKey = pick(candidates);
    const targetSize = VOID_MIN_SIZE + rand(VOID_MAX_SIZE - VOID_MIN_SIZE + 1);
    const blob = [seedKey];
    const seen = new Set(blob);
    const frontier = [seedKey];
    while (blob.length < targetSize && frontier.length) {
      const cur = frontier.shift();
      const h = hexes[cur];
      if (!h) continue;
      for (const nk of neighborsOf(h.q, h.r)) {
        if (blob.length >= targetSize) break;
        if (seen.has(nk) || !hexes[nk]) continue;
        seen.add(nk);
        blob.push(nk);
        frontier.push(nk);
      }
    }
    if (Object.keys(hexes).length - blob.length < minRemaining) continue; // would carve too much
    for (const k of blob) delete hexes[k];
  }
}

function generateTerritories() {
  const keys = Object.keys(hexes);
  const seeds = [];
  const shuffled = keys.slice().sort(() => rngFloat() - 0.5);
  for (let i = 0; i < TERRITORY_COUNT && i < shuffled.length; i++) seeds.push(shuffled[i]);

  territories = seeds.map((key, id) => {
    hexes[key].territoryId = id;
    return { id, hexKeys: [key], owner: -1, force: 1, cx: 0, cy: 0, neighbors: new Set() };
  });

  let claimed = seeds.length;
  const total = keys.length;
  let safety = total * 4;
  while (claimed < total && safety-- > 0) {
    for (const terr of territories) {
      // find an unclaimed hex adjacent to this territory
      let candidates = [];
      for (const hk of terr.hexKeys) {
        const h = hexes[hk];
        for (const nk of neighborsOf(h.q, h.r)) {
          const nh = hexes[nk];
          if (nh && nh.territoryId === -1) candidates.push(nk);
        }
      }
      if (candidates.length) {
        const chosen = pick(candidates);
        hexes[chosen].territoryId = terr.id;
        terr.hexKeys.push(chosen);
        claimed++;
        if (claimed >= total) break;
      }
    }
  }
  // fallback: any leftover unclaimed hex -> nearest territory by centroid distance (rare edge case)
  for (const key of keys) {
    if (hexes[key].territoryId === -1) {
      const h = hexes[key];
      let best = 0, bestD = Infinity;
      for (const t of territories) {
        const c = centroidOf(t);
        const d = (c.x - h.x) ** 2 + (c.y - h.y) ** 2;
        if (d < bestD) { bestD = d; best = t.id; }
      }
      h.territoryId = best;
      territories[best].hexKeys.push(key);
    }
  }

  for (const t of territories) {
    const c = centroidOf(t);
    t.cx = c.x; t.cy = c.y;
  }

  // adjacency + the shared edge (for a visible territory border) between
  // every pair of hexes that belong to two different territories
  territoryBorderSegments = [];
  const seenPairs = new Set();
  for (const key in hexes) {
    const h = hexes[key];
    for (const nk of neighborsOf(h.q, h.r)) {
      const nh = hexes[nk];
      if (nh && nh.territoryId !== h.territoryId) {
        territories[h.territoryId].neighbors.add(nh.territoryId);
        const pairKey = key < nk ? `${key}|${nk}` : `${nk}|${key}`;
        if (!seenPairs.has(pairKey)) {
          seenPairs.add(pairKey);
          const edge = sharedHexEdge(h, nh);
          if (edge) territoryBorderSegments.push(edge);
        }
      }
    }
  }
}

// the two corners two adjacent hexes have in common — i.e. the edge between them.
// Uses the exact (non-inflated) hex size: the fill pass inflates corners by
// +0.6 to hide seams, which also means two neighbors' corners no longer land
// on the same point, so that inflated size can't be used to detect sharing.
function sharedHexEdge(hexA, hexB) {
  const cornersA = hexCorners(hexA.x, hexA.y, HEX_SIZE);
  const cornersB = hexCorners(hexB.x, hexB.y, HEX_SIZE);
  const shared = [];
  for (const pa of cornersA) {
    for (const pb of cornersB) {
      if (Math.abs(pa[0] - pb[0]) < 0.01 && Math.abs(pa[1] - pb[1]) < 0.01) shared.push(pa);
    }
  }
  return shared.length === 2 ? shared : null;
}

function centroidOf(terr) {
  let sx = 0, sy = 0;
  for (const hk of terr.hexKeys) { sx += hexes[hk].x; sy += hexes[hk].y; }
  const avgX = sx / terr.hexKeys.length, avgY = sy / terr.hexKeys.length;
  // Territories are irregular, sometimes concave (C-shaped) blobs. Snapping to
  // whichever hex is merely *closest to the average* can still land right up
  // against another royaume's border on a concave shape, making the force
  // number look like it belongs to the neighboring territory. Instead, pick
  // the hex most surrounded by its own territory (most same-territory
  // neighbors out of 6) — the most "interior" spot — breaking ties by
  // distance to the average.
  let best = hexes[terr.hexKeys[0]], bestScore = -1, bestD = Infinity;
  for (const hk of terr.hexKeys) {
    const h = hexes[hk];
    let interior = 0;
    for (const nk of neighborsOf(h.q, h.r)) {
      const nh = hexes[nk];
      if (nh && nh.territoryId === h.territoryId) interior++;
    }
    const d = (h.x - avgX) ** 2 + (h.y - avgY) ** 2;
    if (interior > bestScore || (interior === bestScore && d < bestD)) {
      best = h; bestScore = interior; bestD = d;
    }
  }
  return { x: best.x, y: best.y };
}

function assignRoyaumes() {
  const seeds = [];
  const remaining = territories.slice();
  // first seed random
  let first = pick(remaining);
  seeds.push(first);
  remaining.splice(remaining.indexOf(first), 1);
  while (seeds.length < ROYAUME_COUNT && remaining.length) {
    let best = null, bestScore = -1;
    for (const cand of remaining) {
      let minD = Infinity;
      for (const s of seeds) {
        const d = (s.cx - cand.cx) ** 2 + (s.cy - cand.cy) ** 2;
        if (d < minD) minD = d;
      }
      if (minD > bestScore) { bestScore = minD; best = cand; }
    }
    seeds.push(best);
    remaining.splice(remaining.indexOf(best), 1);
  }
  seeds.forEach((t, i) => { t.owner = i; });

  // weighted growth order: neutral gets more (easy) or fewer (hard) turns to
  // grow relative to the 4 real royaumes, per NEUTRAL_FRACTION
  const NEUTRAL_ID = ROYAUME_COUNT - 1;
  const RESOLUTION = 100;
  const neutralWeight = Math.max(1, Math.round(NEUTRAL_FRACTION * RESOLUTION));
  const royWeight = Math.max(1, Math.round((1 - NEUTRAL_FRACTION) / (ROYAUME_COUNT - 1) * RESOLUTION));
  let growthOrder = [];
  for (let royId = 0; royId < ROYAUME_COUNT; royId++) {
    const w = (royId === NEUTRAL_ID) ? neutralWeight : royWeight;
    for (let i = 0; i < w; i++) growthOrder.push(royId);
  }
  growthOrder.sort(() => rngFloat() - 0.5);

  let claimedCount = seeds.length;
  const total = territories.length;
  let safety = total * growthOrder.length;
  let oi = 0;
  while (claimedCount < total && safety-- > 0) {
    const royId = growthOrder[oi % growthOrder.length];
    oi++;
    const owned = territories.filter(t => t.owner === royId);
    let candidates = [];
    for (const t of owned) {
      for (const nId of t.neighbors) {
        if (territories[nId].owner === -1) candidates.push(nId);
      }
    }
    if (candidates.length) {
      const chosenId = pick(candidates);
      territories[chosenId].owner = royId;
      claimedCount++;
    }
  }
  for (const t of territories) if (t.owner === -1) t.owner = ROYAUME_COUNT - 1; // stray -> neutral

  for (const t of territories) {
    t.force = t.owner === ROYAUME_COUNT - 1 ? 1 + rand(2) : 1 + rand(3);
  }

  balanceStartingForces();
}

// A royaume that lands more territories from the greedy growth above would
// otherwise also start with more total force (each territory rolls its own
// force independently) — snowballing the game before a single move is made.
// This nudges every real royaume's starting TOTAL force toward an equal
// share (attenuated, not exact — some organic variance from the per-tile
// rolls above survives), then layers a difficulty-scaled edge for the AI
// royaumes on top, redistributed away from the human's share so the grand
// total in play never changes.
function balanceStartingForces() {
  const realIds = [];
  for (let i = 0; i < ROYAUME_COUNT - 1; i++) realIds.push(i); // exclude neutral
  const owned = {}, totals = {}, counts = {};
  let grandTotal = 0;
  for (const royId of realIds) {
    owned[royId] = territories.filter(t => t.owner === royId);
    counts[royId] = owned[royId].length;
    totals[royId] = owned[royId].reduce((s, t) => s + t.force, 0);
    grandTotal += totals[royId];
  }

  // Harder difficulty = bigger AI starting-force edge over the human, on top
  // of the AI's already-higher aggression/lower mistake rate. At Page (0) the
  // weights are equal (pure balance, no edge); at Seigneur (1) each AI's
  // target share is 80% above an equal split.
  const AI_BONUS = lerp(0, 0.8, DIFFICULTY);
  let weightSum = 0;
  const weights = {};
  for (const royId of realIds) {
    weights[royId] = royId === humanRoyId ? 1 : (1 + AI_BONUS);
    weightSum += weights[royId];
  }

  // Attenuated: blend each royaume's actual total toward its target share
  // rather than forcing an exact match.
  const BALANCE_STRENGTH = 0.65;
  for (const royId of realIds) {
    const current = totals[royId];
    if (!current) continue; // shouldn't happen (every royaume seeds at least one territory)
    const target = grandTotal * weights[royId] / weightSum;
    const blended = current + (target - current) * BALANCE_STRENGTH;
    const scale = blended / current;
    for (const t of owned[royId]) t.force = Math.max(1, Math.round(t.force * scale));
  }
}

/* ---------- FORCE ICON DECOMPOSITION ---------- */
function decompose(force) {
  let n12 = Math.floor(force / FORCE_CAP); let rem = force % FORCE_CAP;
  let n4 = Math.floor(rem / ARCHER_THRESHOLD); rem = rem % ARCHER_THRESHOLD;
  let n1 = rem;
  const shapes = [];
  for (let i = 0; i < n12; i++) shapes.push("circle");
  for (let i = 0; i < n4; i++) shapes.push("square");
  for (let i = 0; i < n1; i++) shapes.push("triangle");
  return shapes;
}

/* ---------- GAME STATE ---------- */
// which royaume seat (0-3) the human plays as this game — chosen via the
// faction picker at boot, persisted, changeable from settings
let humanRoyId = 0;
try {
  const savedFaction = localStorage.getItem("kw_humanRoyId");
  if (savedFaction !== null) humanRoyId = Math.max(0, Math.min(3, Number(savedFaction)));
} catch (e) { /* ignore */ }
let currentPlayer = 0;
let selected = -1;
let gameOver = false;
let aiRunning = false;
// "batailles instantanées" — when on, AI turns resolve back-to-back with no
// pacing delay instead of the usual ~0.3-0.5s per move (still async so a long
// AI-vs-AI cascade never blows the call stack, just effectively instant).
// `fastForward` is the live effective state (also flipped on temporarily by
// tapping the end-turn button mid-AI-turn); `instantBattlesSetting` is the
// persisted default it resets back to once control returns to the human.
let instantBattlesSetting = false;
try { instantBattlesSetting = localStorage.getItem("kw_instantBattles") === "1"; } catch (e) { /* ignore */ }
let fastForward = instantBattlesSetting;
function scheduleTurn(fn, delay) { setTimeout(fn, fastForward ? 0 : delay); }

// opt-in meta-progression: one persistent "gueux" earned per victory, purely
// a between-games counter (no in-game spending) — off by default, the count
// itself is kept even while the setting is off so re-enabling doesn't lose it
let metaProgressEnabled = false;
try { metaProgressEnabled = localStorage.getItem("kw_metaProgress") === "1"; } catch (e) { /* ignore */ }
let gueuxCount = 0;
try { gueuxCount = Number(localStorage.getItem("kw_gueuxCount")) || 0; } catch (e) { /* ignore */ }

/* ---------- MATCH HISTORY (stats graph + replay) ---------- */
// One entry per round (a full cycle back to the human), so the end-game
// graph has a shared x-axis across all royaumes. Recorded regardless of
// difficulty/seed — this is what the AoE2-style chart is drawn from.
let statHistory = [];
let roundNumber = 0;
// The human player's own choices, in order (attacks + explicit end-turns).
// Combined with the match's seed + the difficulty active when it started,
// this is enough to reproduce the whole match byte-for-byte for the "watch
// it back" replay — AI moves and dice rolls are already fully determined by
// the seeded RNG stream, so only the human's decisions need recording.
let moveLog = [];
let gameStartDifficulty = DIFFICULTY;
let replaying = false;
let replaySpeed = 1; // AI turn-pacing divisor; set >1 during replay playback

function recordRoundSnapshot() {
  const stats = {};
  for (let royId = 0; royId < ROYAUME_COUNT - 1; royId++) { // exclude neutral
    if (!isAlive(royId)) continue;
    stats[royId] = { territories: territories.filter(t => t.owner === royId).length, force: totalForce(royId) };
  }
  statHistory.push({ round: roundNumber, stats });
}

function largestConnectedGroup(royId) {
  const owned = new Set(territories.filter(t => t.owner === royId).map(t => t.id));
  const visited = new Set();
  let best = 0;
  for (const start of owned) {
    if (visited.has(start)) continue;
    let size = 0;
    const stack = [start];
    visited.add(start);
    while (stack.length) {
      const cur = stack.pop();
      size++;
      for (const n of territories[cur].neighbors) {
        if (owned.has(n) && !visited.has(n)) { visited.add(n); stack.push(n); }
      }
    }
    if (size > best) best = size;
  }
  return best;
}

function totalForce(royId) {
  let s = 0;
  for (const t of territories) if (t.owner === royId) s += t.force;
  return s;
}

// brief non-blocking visual effects (reinforcement glow, combat flash) —
// makes "why did this go from 2 to 6" / "who just won that fight" visible
// without pausing the game or adding any confirmation step
const PULSE_DURATION = 500;
const COMBAT_FX_DURATION = 550;
let pulseTiles = []; // [{id, start}]
let combatFX = null; // {fromId, toId, atk, def, win, start}
let fxRAFRunning = false;
function ensureFXLoop() {
  if (!fxRAFRunning) {
    fxRAFRunning = true;
    requestAnimationFrame(fxStep);
  }
}
function triggerPulse(counts) {
  const ids = Object.keys(counts);
  if (!ids.length) return;
  const now = performance.now();
  pulseTiles = ids.map(id => ({ id: Number(id), amount: counts[id], start: now }));
  ensureFXLoop();
}
function triggerCombatFX(fromId, toId, atk, def, win) {
  combatFX = { fromId, toId, atk, def, win, start: performance.now() };
  ensureFXLoop();
}
function fxStep() {
  const now = performance.now();
  pulseTiles = pulseTiles.filter(p => now - p.start < PULSE_DURATION);
  if (combatFX && now - combatFX.start >= COMBAT_FX_DURATION) combatFX = null;
  render();
  if (pulseTiles.length || combatFX) {
    requestAnimationFrame(fxStep);
  } else {
    fxRAFRunning = false;
  }
}

function rollSum(n) {
  let s = 0;
  for (let i = 0; i < n; i++) s += 1 + rand(6);
  return s;
}

/* ---------- SOUND ---------- */
// Minimal, synthesized (no audio assets) — short, low-pass-filtered tone
// bursts deliberately kept muffled/matte rather than bright "game" beeps, so
// they sit in the background of the experience instead of demanding attention.
let soundEnabled = true;
try {
  const savedSound = localStorage.getItem("kw_soundEnabled");
  if (savedSound !== null) soundEnabled = savedSound !== "0";
} catch (e) { /* ignore */ }
let audioCtx = null;
function ensureAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  return audioCtx;
}
function playTone(freq, duration, opts = {}) {
  if (!soundEnabled || replaying) return;
  const ac = ensureAudioCtx();
  if (!ac) return;
  const t0 = ac.currentTime;
  const osc = ac.createOscillator();
  osc.type = opts.type || "sine";
  osc.frequency.setValueAtTime(freq, t0);
  if (opts.slideTo) osc.frequency.exponentialRampToValueAtTime(opts.slideTo, t0 + duration);
  const filter = ac.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = opts.cutoff || 900;
  const gain = ac.createGain();
  const vol = opts.volume || 0.08;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(filter); filter.connect(gain); gain.connect(ac.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}
function sfxAttack(win) {
  playTone(win ? 220 : 140, 0.16, { type: "triangle", cutoff: 700, volume: 0.09, slideTo: win ? 160 : 90 });
}
function sfxEndTurn() { playTone(120, 0.14, { type: "sine", cutoff: 480, volume: 0.06 }); }
function sfxVictory() {
  [440, 550, 660].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.3, { type: "triangle", cutoff: 1200, volume: 0.08 }), i * 120);
  });
}

let DETERMINISTIC_COMBAT = false; // testable via the ⚙ menu — bigger force always wins, no dice
try {
  if (localStorage.getItem("kw_deterministicCombat") === "1") DETERMINISTIC_COMBAT = true;
} catch (e) { /* storage unavailable — keep the default */ }

let lastAttackWasGrind = false; // both sides near the force cap — used for the victory flavor text
function attack(fromId, toId) {
  const from = territories[fromId], to = territories[toId];
  lastAttackWasGrind = from.force >= FORCE_CAP - 2 && to.force >= FORCE_CAP - 2;
  const atk = DETERMINISTIC_COMBAT ? from.force : rollSum(from.force);
  const def = DETERMINISTIC_COMBAT ? to.force : rollSum(to.force);
  const win = atk > def;
  logMsg(`${ROYAUMES[from.owner].name} attaque ${ROYAUMES[to.owner].name} — ${atk} vs ${def} — ${win ? "victoire" : "échec"}`);
  triggerCombatFX(fromId, toId, atk, def, win);
  sfxAttack(win);
  if (win) {
    to.owner = from.owner;
    to.force = Math.max(1, from.force - 1);
    from.force = 1;
  } else {
    from.force = 1;
  }
  checkElimination();
  render();
  return win;
}

// AI seats stack their reinforcements on their attacking frontier instead of
// spreading them randomly across the kingdom — a territory bordering a
// weaker enemy scores higher, so the AI arrives at its own turn with a
// stronger stack ready to swing rather than points wasted deep in its own
// territory. The human's own reinforcement stays uniformly random, same as
// before (it was never something the player controlled anyway).
function pickReinforceTarget(royId, owned) {
  if (royId === humanRoyId) return pick(owned);
  let best = null, bestScore = -Infinity;
  for (const t of owned) {
    let score = -1;
    for (const nId of t.neighbors) {
      const n = territories[nId];
      if (n.owner === royId) continue;
      score = Math.max(score, t.force - n.force + 3);
    }
    score += rngFloat() * 0.5; // light tie-breaking randomization
    if (score > bestScore) { bestScore = score; best = t; }
  }
  return best || pick(owned);
}

function endTurn() {
  if (gameOver) return;
  const royId = currentPlayer;
  const reinforcement = largestConnectedGroup(royId);
  let pts = reinforcement;
  let guardCount = 0;
  const reinforcedCounts = {}; // territory id -> how many points landed there
  while (pts > 0 && guardCount < 500) {
    guardCount++;
    const owned = territories.filter(t => t.owner === royId && t.force < FORCE_CAP);
    if (!owned.length) break;
    const chosen = pickReinforceTarget(royId, owned);
    chosen.force++;
    reinforcedCounts[chosen.id] = (reinforcedCounts[chosen.id] || 0) + 1;
    pts--;
  }
  logMsg(`${ROYAUMES[royId].name} reçoit ${reinforcement} renfort(s).`);
  selected = -1;
  triggerPulse(reinforcedCounts);
  if (royId === humanRoyId) sfxEndTurn(); // only for the player's own turn, not every AI seat
  advanceTurn();
}

function advanceTurn() {
  if (gameOver) return;
  let next = currentPlayer;
  let guard = 0;
  do {
    next = (next + 1) % ROYAUME_COUNT;
    guard++;
  } while ((!isAlive(next) || ROYAUMES[next].neutral) && guard <= ROYAUME_COUNT);
  currentPlayer = next;
  if (currentPlayer === humanRoyId && !replaying) {
    roundNumber++;
    recordRoundSnapshot();
  }
  updateStatus();
  render();
  if (checkWinner()) return;
  if (currentPlayer !== humanRoyId && !ROYAUMES[currentPlayer].neutral) {
    aiRunning = true;
    scheduleTurn(runAI, 350 / replaySpeed); // 500 * 0.7 — AI turn pacing sped up 30%
  }
}

function isAlive(royId) {
  return territories.some(t => t.owner === royId);
}

function checkElimination() {
  // purely informational; advanceTurn's isAlive() already skips empty royaumes
}

function checkWinner() {
  const ownersLeft = new Set(territories.map(t => t.owner));
  const nonNeutral = [...ownersLeft].filter(id => !ROYAUMES[id].neutral);
  if (nonNeutral.length <= 1 && ownersLeft.size <= 2) {
    gameOver = true;
    const winnerId = nonNeutral[0];
    showWin(winnerId);
    return true;
  }
  return false;
}

function showWin(royId) {
  document.getElementById("winbanner").style.display = "flex";
  document.getElementById("winKnight").src = CHEVALIER_IMG_SRC;
  if (royId === humanRoyId) {
    sfxVictory();
    if (metaProgressEnabled) {
      gueuxCount++;
      try { localStorage.setItem("kw_gueuxCount", String(gueuxCount)); } catch (e) { /* ignore */ }
      refreshGueuxBadge();
    }
  }
  const text = lastAttackWasGrind
    ? "Bravo seigneur, vous avez guerroyé férocement aujourd'hui, la dernière bataille était dure !"
    : (royId === humanRoyId) ? `Victoire, ${ROYAUMES[royId].name} !` : `${ROYAUMES[royId].name} l'emporte.`;
  document.getElementById("wintext").textContent = text;
  document.getElementById("endturn").disabled = true;
  drawStatChart();
  document.getElementById("watchReplay").disabled = moveLog.length === 0;
}

// --- end-of-match stats chart (AoE2-style: territories + force over rounds) ---
function drawStatChart() {
  const canvas = document.getElementById("statChart");
  const c = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  c.clearRect(0, 0, W, H);
  if (statHistory.length < 2) return;

  const royIds = Object.keys(statHistory[statHistory.length - 1].stats).map(Number);
  const panels = [
    { key: "territories", x: 6, w: W / 2 - 10, label: "Territoires" },
    { key: "force", x: W / 2 + 4, w: W / 2 - 10, label: "Force" },
  ];
  const top = 18, bottom = H - 6, plotH = bottom - top;

  for (const panel of panels) {
    c.strokeStyle = "rgba(242,237,226,.25)";
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(panel.x, top); c.lineTo(panel.x, bottom); c.lineTo(panel.x + panel.w, bottom);
    c.stroke();

    let maxVal = 1;
    for (const entry of statHistory) {
      for (const royId of royIds) {
        const s = entry.stats[royId];
        if (s) maxVal = Math.max(maxVal, s[panel.key]);
      }
    }

    for (const royId of royIds) {
      c.strokeStyle = ROYAUMES[royId].color;
      c.lineWidth = 1.8;
      c.beginPath();
      let started = false;
      statHistory.forEach((entry, i) => {
        const s = entry.stats[royId];
        if (!s) return; // this royaume was already eliminated — line just stops
        const x = panel.x + (i / (statHistory.length - 1)) * panel.w;
        const y = bottom - (s[panel.key] / maxVal) * plotH;
        if (!started) { c.moveTo(x, y); started = true; } else { c.lineTo(x, y); }
      });
      c.stroke();
    }

    c.fillStyle = "rgba(242,237,226,.7)";
    c.font = "10px -apple-system, sans-serif";
    c.textAlign = "left";
    c.fillText(panel.label, panel.x, 10);
  }
}

// --- fast in-app replay: re-simulate the same seed + difficulty, feeding
// back only the human player's own recorded choices — the AI and dice
// reproduce identically since they're driven by the same seeded RNG stream ---
function startReplay() {
  if (!moveLog.length) return;
  const seedToReplay = currentSeed;
  const difficultyToReplay = gameStartDifficulty;
  const logToReplay = moveLog.slice();
  const levelToRestore = difficultyLevel;

  document.getElementById("winbanner").style.display = "none";
  document.getElementById("rerollBtn").style.display = "none";
  replaying = true;
  replaySpeed = 6;
  applyDifficulty(difficultyToReplay);
  startGame(seedToReplay);

  let i = 0;
  function step() {
    if (!replaying) return; // user could in principle navigate away; bail cleanly
    if (gameOver) { finishReplay(levelToRestore); return; }
    if (currentPlayer !== humanRoyId || aiRunning) { setTimeout(step, 30); return; }
    if (i >= logToReplay.length) { finishReplay(levelToRestore); return; }
    const action = logToReplay[i++];
    if (action.end) endTurn(); else attack(action.a, action.b);
    setTimeout(step, 30);
  }
  step();
}
function finishReplay(levelToRestore) {
  replaying = false;
  replaySpeed = 1;
  applyDifficulty(DIFFICULTY_LEVELS[levelToRestore].value);
  document.getElementById("rerollBtn").style.display = "";
  document.getElementById("winbanner").style.display = "flex";
}

/* ---------- AI ---------- */
function runAI() {
  const royId = currentPlayer;
  if (gameOver || royId === humanRoyId) { aiRunning = false; return; }

  function bestMove() {
    const territoryCount = {};
    for (const t of territories) territoryCount[t.owner] = (territoryCount[t.owner] || 0) + 1;

    let best = null, bestScore = -Infinity;
    for (const t of territories) {
      if (t.owner !== royId || t.force <= 1) continue;
      for (const nId of t.neighbors) {
        const n = territories[nId];
        if (n.owner === royId) continue;
        const adv = t.force - n.force;
        if (adv < escalated(AI_AGGRESSION_THRESHOLD, -1)) continue;

        // prefer finishing off a nearly-eliminated royaume over a marginally
        // better trade elsewhere
        let score = adv + (territoryCount[n.owner] <= 2 ? 2 : 0);

        // attacking always drops `from` to force 1 (win or lose) — penalize
        // leaving it exposed to a strong hostile neighbor other than the target
        let exposure = 0;
        for (const oId of t.neighbors) {
          if (oId === nId) continue;
          const o = territories[oId];
          if (o.owner !== royId) exposure = Math.max(exposure, o.force);
        }
        score -= exposure * 0.3;

        if (score > bestScore) { bestScore = score; best = { from: t.id, to: nId }; }
      }
    }
    return best;
  }

  const mv = bestMove();
  if (mv && rngFloat() >= escalated(AI_MISTAKE_RATE, 0.05)) {
    attack(mv.from, mv.to);
    scheduleTurn(runAI, 315 / replaySpeed); // 450 * 0.7
  } else {
    aiRunning = false;
    scheduleTurn(endTurn, 210 / replaySpeed); // 300 * 0.7
  }
}

/* ---------- RENDER ---------- */
function render() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(centerX, centerY);
  ctx.scale(viewScale, viewScale);

  for (const key in hexes) {
    const h2 = hexes[key];
    const t = territories[h2.territoryId];
    const roy = ROYAUMES[t.owner];
    const pts = hexCorners(h2.x, h2.y, HEX_SIZE + 0.6);
    ctx.beginPath();
    pts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.closePath();
    ctx.fillStyle = roy.color;
    ctx.fill();
    // faint texture on every hex edge, incl. hexes within the same territory
    ctx.strokeStyle = "rgba(20,16,12,0.15)";
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // territory borders: the one thing that actually matters for reading the
  // map — a territory is every hex sharing one color blob, and this is the
  // only line telling you where one blob (and its tap target) stops and the
  // next starts, so it's drawn clearly and always-on, not just on hover/select.
  ctx.strokeStyle = "rgba(20,16,12,0.85)";
  ctx.lineWidth = 1.6;
  ctx.lineCap = "round";
  for (const [[x1, y1], [x2, y2]] of territoryBorderSegments) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // selection highlight — a silver bevel around the *territory's* outer
  // perimeter, not every individual hex inside it (that was the original
  // bug: it used to stroke each hex's own hexagon, drawing a full honeycomb
  // grid instead of one outline around the selected village).
  if (selected !== -1) {
    const t = territories[selected];
    const outline = [];
    for (const hk of t.hexKeys) {
      const h2 = hexes[hk];
      for (const [dq, dr] of NEI) {
        const nh = hexes[`${h2.q + dq},${h2.r + dr}`];
        if (!nh || nh.territoryId !== h2.territoryId) {
          // real neighbor of a different territory, or no neighbor at all
          // (edge of the island) — either way this edge is on the outline
          const npos = nh || axialToPixel(h2.q + dq, h2.r + dr);
          const edge = sharedHexEdge(h2, npos);
          if (edge) outline.push(edge);
        }
      }
    }
    ctx.beginPath();
    for (const [[x1, y1], [x2, y2]] of outline) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
    // dark outer edge first (reads as a shadow), then a brighter silver
    // gradient stroke on top — a cheap but effective "polished metal" bevel
    ctx.strokeStyle = "rgba(20,16,12,0.6)";
    ctx.lineWidth = 3.6;
    ctx.lineCap = "round";
    ctx.stroke();
    const grad = ctx.createLinearGradient(t.cx - HEX_SIZE, t.cy - HEX_SIZE, t.cx + HEX_SIZE, t.cy + HEX_SIZE);
    grad.addColorStop(0, "#f4f6f9");
    grad.addColorStop(0.5, "#aab2bf");
    grad.addColorStop(1, "#7c848f");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // force icons
  for (const t of territories) {
    drawForceIcon(t);
  }

  // reinforcement pulse — a brief fading ring on territories that just gained force
  const pulseNow = performance.now();
  for (const p of pulseTiles) {
    const t = territories[p.id];
    if (!t) continue;
    const elapsed = pulseNow - p.start;
    if (elapsed >= PULSE_DURATION) continue;
    const progress = elapsed / PULSE_DURATION;
    ctx.beginPath();
    ctx.arc(t.cx, t.cy, 10 + progress * 10, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 214, 92, ${1 - progress})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    const alpha = 1 - progress;
    ctx.font = "bold 12px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.strokeStyle = `rgba(20,16,12,${alpha * 0.8})`;
    ctx.lineWidth = 2.5;
    ctx.strokeText(`+${p.amount}`, t.cx, t.cy - 16 - progress * 10);
    ctx.fillStyle = `rgba(255, 214, 92, ${alpha})`;
    ctx.fillText(`+${p.amount}`, t.cx, t.cy - 16 - progress * 10);
  }

  // combat flash — the atk/def rolls float briefly over both territories,
  // with a ring on whichever tile the outcome actually changed
  if (combatFX && pulseNow - combatFX.start < COMBAT_FX_DURATION) {
    const progress = (pulseNow - combatFX.start) / COMBAT_FX_DURATION;
    const alpha = 1 - progress;
    const fromT = territories[combatFX.fromId];
    const toT = territories[combatFX.toId];
    const floatY = -14 - progress * 10;

    // a small drawn sword, midway between attacker and defender and pointed
    // toward the defender, drawn only for the first half so it reads as a
    // quick strike rather than lingering (was a plain line+arrowhead)
    if (fromT && toT && progress < 0.5) {
      const swordAlpha = (1 - progress / 0.5);
      const dx = toT.cx - fromT.cx, dy = toT.cy - fromT.cy;
      const dist = Math.hypot(dx, dy);
      const ux = dx / dist, uy = dy / dist;
      const angle = Math.atan2(uy, ux);
      const midX = (fromT.cx + toT.cx) / 2, midY = (fromT.cy + toT.cy) / 2;

      ctx.save();
      ctx.translate(midX, midY);
      ctx.rotate(angle);
      const bladeLen = 14, bladeW = 2.4;
      // blade, tip pointing toward the defender (+x after rotation)
      ctx.beginPath();
      ctx.moveTo(bladeLen / 2 + 4, 0);
      ctx.lineTo(bladeLen / 2 - 3, -bladeW);
      ctx.lineTo(-bladeLen / 2, -bladeW * 0.6);
      ctx.lineTo(-bladeLen / 2, bladeW * 0.6);
      ctx.lineTo(bladeLen / 2 - 3, bladeW);
      ctx.closePath();
      ctx.fillStyle = `rgba(224,228,235,${swordAlpha * 0.95})`;
      ctx.fill();
      // crossguard + grip, in the chief/gold accent
      ctx.strokeStyle = `rgba(198,161,91,${swordAlpha * 0.95})`;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-bladeLen / 2, -4);
      ctx.lineTo(-bladeLen / 2, 4);
      ctx.moveTo(-bladeLen / 2, 0);
      ctx.lineTo(-bladeLen / 2 - 4, 0);
      ctx.stroke();
      ctx.restore();
    }

    ctx.font = "bold 11px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 2.5;
    if (fromT) {
      ctx.strokeStyle = `rgba(20,16,12,${alpha * 0.8})`;
      ctx.strokeText(String(combatFX.atk), fromT.cx, fromT.cy + floatY);
      ctx.fillStyle = `rgba(242,237,226,${alpha})`;
      ctx.fillText(String(combatFX.atk), fromT.cx, fromT.cy + floatY);
    }
    if (toT) {
      ctx.strokeStyle = `rgba(20,16,12,${alpha * 0.8})`;
      ctx.strokeText(String(combatFX.def), toT.cx, toT.cy + floatY);
      ctx.fillStyle = `rgba(242,237,226,${alpha})`;
      ctx.fillText(String(combatFX.def), toT.cx, toT.cy + floatY);
    }

    const ringT = combatFX.win ? toT : fromT;
    if (ringT) {
      ctx.beginPath();
      ctx.arc(ringT.cx, ringT.cy, 11 + progress * 6, 0, Math.PI * 2);
      ctx.strokeStyle = combatFX.win ? `rgba(90,200,120,${alpha})` : `rgba(200,70,60,${alpha})`;
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // plain-language outcome, in addition to the raw dice numbers above
      ctx.font = "bold 11px -apple-system, sans-serif";
      const label = combatFX.win ? "+1 territoire" : "échec";
      ctx.strokeStyle = `rgba(20,16,12,${alpha * 0.8})`;
      ctx.lineWidth = 2.5;
      ctx.strokeText(label, ringT.cx, ringT.cy + floatY - 12);
      ctx.fillStyle = combatFX.win ? `rgba(90,200,120,${alpha})` : `rgba(200,70,60,${alpha})`;
      ctx.fillText(label, ringT.cx, ringT.cy + floatY - 12);
    }
  }

  ctx.restore();
  updateGroups();
}

let sortGroupsBy = "territories"; // or "force" — see settings panel
try {
  const savedSort = localStorage.getItem("kw_sortGroupsBy");
  if (savedSort === "force" || savedSort === "territories") sortGroupsBy = savedSort;
} catch (e) { /* ignore */ }

function updateGroups() {
  const el = document.getElementById("groups");
  const rows = [];
  for (let royId = 0; royId < ROYAUME_COUNT - 1; royId++) { // exclude neutral (last)
    if (!isAlive(royId)) continue;
    rows.push({ roy: ROYAUMES[royId], connected: largestConnectedGroup(royId), force: totalForce(royId) });
  }
  rows.sort((a, b) => sortGroupsBy === "force" ? b.force - a.force : b.connected - a.connected);
  el.innerHTML = rows.map(r =>
    `<span class="chip"><span class="swatch" style="background:${r.roy.color}"></span>` +
    `${r.roy.name} <span class="n">${r.connected}</span>·${r.force}</span>`
  ).join("");
}

const UNIT_IMG = { triangle: GUEUX_IMG, square: ARCHER_IMG, circle: CHEVALIER_IMG };
const UNIT_ASPECT = {
  triangle: 360 / 1035,
  square: 441 / 873,
  circle: 540 / 820,
};
// fraction of each source bitmap's own height actually occupied by the
// character (measured via pixel-density scan). The chevalier sprite was cut
// from a larger repeating cross-stitch pattern — its dense knight-on-horse
// core is only ~62% of the image height, the rest is a thin banner/weapon
// tip up top and legs/hooves at the bottom. Drawing all three sprites at the
// same nominal height therefore made the knight look much smaller than the
// gueux/archer, whose source art is cropped tight to the figure (~91-100%).
// Scaling each sprite's drawn height by 1/fraction keeps their *visible*
// figures a consistent size instead of their raw bitmaps.
const UNIT_CONTENT_FRACTION = { triangle: 1.0, square: 0.91, circle: 0.62 };

function drawForceIcon(t) {
  ctx.textAlign = "center";

  if (!SHOW_UNIT_SPRITES) {
    // Sprites temporarily disabled per request — plain (double-size) number
    // only. The sprite-drawing code below is left in place, untouched, to
    // switch back on later by flipping SHOW_UNIT_SPRITES.
    ctx.font = "bold 22px -apple-system, sans-serif";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(20,16,12,0.85)";
    ctx.fillStyle = "#f2ede2";
    ctx.strokeText(String(t.force), t.cx, t.cy + 5);
    ctx.fillText(String(t.force), t.cx, t.cy + 5);
    return;
  }

  const shapes = decompose(t.force);
  const baseH = 13;
  const heights = shapes.map(s => baseH / UNIT_CONTENT_FRACTION[s]);
  const widths = shapes.map((s, i) => heights[i] * UNIT_ASPECT[s]);
  const gap = 1.5;
  const totalW = widths.reduce((a, b) => a + b, 0) + gap * (shapes.length - 1);
  let x = t.cx - totalW / 2;
  const yBottom = t.cy + baseH / 2; // all icons share the same "ground line"
  for (let i = 0; i < shapes.length; i++) {
    const img = UNIT_IMG[shapes[i]];
    const w = widths[i], h = heights[i];
    if (img.complete && img.naturalWidth) ctx.drawImage(img, x, yBottom - h, w, h);
    x += w + gap;
  }
  ctx.fillStyle = "#f2ede2";
  ctx.strokeStyle = "rgba(20,16,12,0.8)";
  ctx.lineWidth = 2;
  ctx.font = "bold 22px -apple-system, sans-serif";
  ctx.strokeText(String(t.force), t.cx, yBottom + 8);
  ctx.fillText(String(t.force), t.cx, yBottom + 8);
}

/* ---------- INPUT ---------- */
let firstClickDone = false;

function territoryAtClientPoint(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const localX = (clientX - rect.left - centerX) / viewScale;
  const localY = (clientY - rect.top - centerY) / viewScale;
  const { q, r } = pixelToAxial(localX, localY);
  const h2 = hexes[`${q},${r}`];
  return h2 ? territories[h2.territoryId] : null;
}

// the pointerup that ends a drag-to-attack also fires a subsequent "click" —
// this skips that one so the drag isn't immediately followed by a tap-based
// selection/attack on the same gesture
let suppressNextClick = false;

function handlePointer(clientX, clientY) {
  if (suppressNextClick) { suppressNextClick = false; return; }
  if (replaying || gameOver || aiRunning || currentPlayer !== humanRoyId) return;
  if (!firstClickDone) {
    firstClickDone = true;
    document.getElementById("rerollBtn").style.display = "none";
  }
  const t = territoryAtClientPoint(clientX, clientY);
  if (!t) return;
  const tId = t.id;

  if (selected === -1) {
    if (t.owner === currentPlayer && t.force > 1) {
      selected = tId;
      if (onboarding) logMsg("Cliquez pour attaquer une zone ennemie adjacente.");
    }
  } else if (selected === tId) {
    selected = -1;
  } else {
    const selTerr = territories[selected];
    if (t.owner !== currentPlayer && selTerr.neighbors.has(tId)) {
      if (onboarding) {
        onboarding = false;
        try { localStorage.setItem("kw_playedBefore", "1"); } catch (e) { /* ignore */ }
      }
      if (!replaying) moveLog.push({ a: selected, b: tId });
      attack(selected, tId);
      selected = (territories[selected].force > 1) ? selected : -1;
    } else if (t.owner === currentPlayer && t.force > 1) {
      selected = tId;
    } else {
      selected = -1;
    }
  }
  render();
}
canvas.addEventListener("click", (e) => handlePointer(e.clientX, e.clientY));

// --- optional drag-to-attack: drag from an owned territory straight onto an
// adjacent enemy one to attack, instead of the default tap-then-tap. Off by
// default (settings toggle) so it never changes behavior unless opted into.
let dragToAttackEnabled = false;
try { dragToAttackEnabled = localStorage.getItem("kw_dragToAttack") === "1"; } catch (e) { /* ignore */ }
const DRAG_THRESHOLD = 18; // px in screen space, below this it's treated as a plain tap
let dragStart = null; // {tId, x, y}
let dragActive = false;
canvas.addEventListener("pointerdown", (e) => {
  if (!dragToAttackEnabled || replaying || gameOver || aiRunning || currentPlayer !== humanRoyId) return;
  const t = territoryAtClientPoint(e.clientX, e.clientY);
  if (t && t.owner === currentPlayer && t.force > 1) {
    dragStart = { tId: t.id, x: e.clientX, y: e.clientY };
    dragActive = false;
  }
});
canvas.addEventListener("pointermove", (e) => {
  if (!dragStart) return;
  if (Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) > DRAG_THRESHOLD) dragActive = true;
});
canvas.addEventListener("pointerup", (e) => {
  if (!dragStart) return;
  const from = dragStart, wasActive = dragActive;
  dragStart = null; dragActive = false;
  if (!wasActive) return; // short movement — let the plain click handler treat it as a tap
  suppressNextClick = true;
  const fromT = territories[from.tId];
  const targetT = territoryAtClientPoint(e.clientX, e.clientY);
  if (!targetT || targetT.id === from.tId || targetT.owner === currentPlayer) return;
  if (!fromT.neighbors.has(targetT.id) || fromT.force <= 1) return;
  if (!firstClickDone) { firstClickDone = true; document.getElementById("rerollBtn").style.display = "none"; }
  if (onboarding) { onboarding = false; try { localStorage.setItem("kw_playedBefore", "1"); } catch (err) { /* ignore */ } }
  if (!replaying) moveLog.push({ a: from.tId, b: targetT.id });
  attack(from.tId, targetT.id);
  selected = -1;
  render();
});

document.getElementById("endturn").addEventListener("click", () => {
  if (replaying || gameOver) return;
  if (currentPlayer === humanRoyId) {
    if (aiRunning) return;
    moveLog.push({ end: true });

    // "La guerre fait rage" — tapping it while the AIs are playing instantly

});

    try { localStorage.setItem("kw_sortGroupsBy", sortGroupsBy); } catch (e) { /* ignore */ }
    refreshSortButtons();
    updateGroups();
  });
});

/* ---------- STATUS / LOG ---------- */
function updateStatus() {
  document.getElementById("status").textContent =
    `Tour : ${ROYAUMES[currentPlayer].name}` + (currentPlayer === humanRoyId ? " (toi)" : "");
  updateEndTurnButton();
  // once it's the human's turn again, drop back to the persisted "batailles
  // instantanées" setting — a manual tap-to-skip during the AI's turn is a
  // one-off, not a standing override
  if (currentPlayer === humanRoyId) fastForward = instantBattlesSetting;
}

// luminance-based contrast pick so light royaume colors (e.g. Châteauvieux's
// near-white) get dark text and dark ones (Beaumanoir's navy) get light text
function textColorFor(hex) {
  const c = hex.replace("#", "");
  const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.55 ? "#241d16" : "#f2ede2";
}

function updateEndTurnButton() {
  const btn = document.getElementById("endturn");
  const isHuman = currentPlayer === humanRoyId;
  btn.textContent = isHuman ? "Fin de bataille" : "La guerre fait rage";
  btn.classList.toggle("aiTurn", !isHuman);
  const roy = ROYAUMES[humanRoyId];
  btn.style.background = roy.color;
  btn.style.color = textColorFor(roy.color);
}

function logMsg(msg) {
  document.getElementById("log").textContent = msg;
}

function refreshGueuxBadge() {
  const el = document.getElementById("gueuxBadge");
  el.style.display = metaProgressEnabled ? "flex" : "none";
  el.textContent = `🧑‍🌾 ${gueuxCount}`;
}
refreshGueuxBadge();

/* ---------- BOOT ---------- */
let onboarding = false;
try { onboarding = localStorage.getItem("kw_playedBefore") !== "1"; } catch (e) { /* ignore */ }

function startGame(seed) {
  document.getElementById("winbanner").style.display = "none";
  document.getElementById("endturn").disabled = false;
  gameOver = false; selected = -1; currentPlayer = 0; aiRunning = false;
  currentSeed = seed === undefined ? randomSeed() : seed;
  seedRNG(currentSeed);
  generateHexGrid();
  generateTerritories();
  assignRoyaumes();
  if (!replaying) {
    statHistory = []; roundNumber = 0; moveLog = []; gameStartDifficulty = DIFFICULTY;
    recordRoundSnapshot();
  }
  updateStatus();
  logMsg(onboarding ? "Cliquez sur un territoire blanc." : "Nouvelle partie.");
  updateGroups(); // populate before resize() measures the HUD's real height
  resize();
  // seat 0 always plays first regardless of which royaume is human-controlled
  // — if that's an AI seat, kick its turn off (advanceTurn only does this on
  // *later* turn changes, not the very first one)
  if (currentPlayer !== humanRoyId && !ROYAUMES[currentPlayer].neutral) {
    aiRunning = true;
    scheduleTurn(runAI, 350 / replaySpeed);
  }
}

startGame();
</script>
